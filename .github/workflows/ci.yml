name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm -r typecheck

      # Contracts are code: a malformed one should fail the build, not a 3am sweep.
      - name: Validate contracts
        run: node apps/cli/dist/src/index.js contracts

      # Proves the detect -> heal -> gate -> verify loop end to end, with no
      # credentials and no credits, on every single push.
      - name: Replay the self-healing loop
        run: node apps/cli/dist/src/index.js watch --replay ./fixtures --ledger ./data/ci.jsonl
